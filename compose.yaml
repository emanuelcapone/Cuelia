services:
  app:
    build: .
    image: ${CUELIA_IMAGE:-cuelia:local}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://cuelia:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/cuelia
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - media:/app/data/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: cuelia
      POSTGRES_DB: cuelia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuelia -d cuelia"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres:
  media:
